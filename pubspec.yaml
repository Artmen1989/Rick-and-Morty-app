name: rick_and_morty_app
description: A Flutter app for Rick and Morty characters

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_bloc: ^8.1.1
  equatable: ^2.0.5
  
  # Network
  dio: ^5.3.0
  http: ^1.1.0
  
  # Database
  isar: ^3.1.0
  isar_flutter_libs: ^3.1.0
  
  # Storage
  shared_preferences: ^2.2.2
  
  # Images
  cached_network_image: ^3.3.0
  flutter_cache_manager: ^3.3.0
  
  # UI
  pull_to_refresh: ^2.0.0
  shimmer: ^2.0.0
  
  # Utilities
  path_provider: ^2.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  isar_generator: ^3.1.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true